dimensions:
  - id: business_model
    label: 商业模式（1-5分）
    hint: 评「赚钱机器」设计：说得清、能反复收、单元算得通；公司可暂亏，单元不能长期亏
    ttl_days: 90
    essence: >
      核心问题：这门生意能否被理解，且设计上能把价值变成真实现金？
      评的是「机器好不好」，不是「今年净利润正负」：整体可阶段性亏损（研发、扩产、获客），
      但边际上多卖一单应有合理毛利，不能长期靠补贴、应收堆收入或外部输血才能转。
      四要素：可理解（三句话讲清谁付钱为何付）、可重复（非一次性/运气/黑天鹅）、
      单位经济成立（剥掉应收、补贴、过度再投入与高负债后逻辑仍通）、
      可预测（10年后能否自然赚钱，而非永远讲故事或因为运营成本增加而亏损）。
      边界：定价权、竞争壁垒、成长跑道、估值归其他维度；本维度不因「暂时亏损」自动打低，
      也不因「收入高增长」自动打高。
    scoring_checks:
      - 三句话讲清：卖什么、谁付钱、为何持续付？
      - 收入是否可持续：重复性，还是一次性/靠补贴/靠运气/靠短期催化？
      - 单位经济：毛利是否合理？多卖一单贡献是正还是负？（公司亏损可接受，单元长期为负则不行）
      - 若整体仍亏损：主因是研发/产能/获客等「先投后赚」，还是补贴换量、应收堆规模？
      - 去掉应收、补贴、过度再投入与高负债后，这门生意逻辑上能否大致运转？
      - 10 年后卖什么、怎么收钱，是否仍是同一类生意（而非靠转型硬撑）？
      - 如果10年后公司运营成本(劳动力,原材料,能源,租金等）涨价，公司会不会亏损？
    rubric:
      1: 说不清怎么赚钱或模式常变；或单元经济长期为负，靠输血/补贴/应收才能维持
      2: 能描述产品但收费逻辑虚；收入不稳；剥洋葱后仍很脆，看不出规模化能自然赚钱
      3: 模式清楚；收入重复性一般但可见；单元经济基本成立；
      4: 重复收入可预见；单元经济健康，剥洋葱后仍通；暂亏则因阶段性投入，且有过盈利或现金流验证
      5: 重复收入可预见、极清晰、高重复；单元经济强，剥洋葱后仍厚；

  - id: moat
    label: 护城河（1-5分）
    hint: 评用户离不离得开、力量变宽还是变窄；晚期看涨价走不走，早期看越用越离不开；再用资本复制、付费方依赖、政策结构做压力测试。
    ttl_days: 90
    essence: >
      核心问题：让用户离不开、且随时间变宽的结构性力量有多强？
      护城河在变宽还是变窄——竞争压力下每天变强或变弱，不是静态标签。
      晚期用定价权验证：涨价后用户会不会走；早期用机制验证：越用会不会越离不开。
      再用scoring_checks的问题做压力测试，区分真壁垒与脆弱优势。
      边界：商业模式、管理层、成长、估值、具体风险各自单独评，不混入本维度。
    scoring_checks:
      - 用户主要为价格/效率留下，还是为不可替代的价值留下？
      - 涨价或对手略优时，用户是不是非你不可，会不会立刻流失？
      - 早期：使用越深，迁移成本、习惯或网络效应是否在加强？
      - 晚期：这个世界如果突然没有了这家公司，社会/付费方/产业链/用户有重大缺失/损失/缺口/不方便吗？
      - 护城河是在逐年变宽（复购加深、份额稳固），还是在变窄？
      - 出现合理范围内的黑天鹅（政策、地缘、疫情、灾害等）时，是否壁垒仍能扛住，还是优势会迅速瓦解？
      - 10 年后用户是否仍默认选你、品牌与关系是否仍牢？
      - 中晚期：假如给创业者百亿,能不能把这公司干掉？
    rubric:
      1: 用户主要为便宜留下；涨价即走；无可见变宽机制，优势在缩小
      2: 有一点差异化，但对手易模仿；定价权弱，机制未形成复利
      3: 有结构性差异，对手抄需时间和投入；机制在形成或部分验证，定价权尚不清晰
      4: 优势已验证，越用越离不开或对手进入代价高；仍在主动变宽
      5: 定价权清晰，涨价用户不走；对手大量投入也难撼动，力量持续变宽

  - id: growth_story
    label: 成长性（1-5分）
    hint: 评十年长期赚钱能力是否更高；若更高，看空间、引擎、耐久。
    ttl_days: 60
    essence: >
      核心问题: 10 年后长期赚钱能力是否系统性高于今天？
      （常态挣钱本事，非某年突发或一次性利好。）
      还剩多大空间、靠什么引擎反复兑现、会不会两三年后见顶。要能在十年尺度上讲通，不能只赌一两年。
      边界：护城河、管理层、估值、具体风险各自单独评；本维不评「便不便宜」「壁垒深不深」。
    scoring_checks:
      - 10 年后长期赚钱能力会更高，还是持平/萎缩？
      - 增长靠提价（无成本），还是扩产（需成本）？前者更好
      - 结合参考信息中的市值、营收：相对行业可达空间，跑道还有多长？
      - 如果是新产品，是否有足够市场潜力，保证未来十年可持续增长？
      - 是否有决心持续开发新产品或工艺以保持增长？
      - 如果是持续增长型,过去3-5年EPS增速是否在20-30%以上？这个高速增长未来几年是否可持续？
      - 如果是周期型、困境反转型，库存和产能周期到底部了吗？
      - 如果是困境反转型公司有没有通过回购注销或者降本增效来提升EPS？
      - 若增长依赖技术或持续产品迭代，研发投入如何？（优先对照量化「成长性与研发」）
      - 客户喜欢/急需吗？产品是否已出现抢购/囤货/排队/用户增长等趋势？
    rubric:
      1: 十年后长期赚钱能力不更高或结构性萎缩；空间/引擎/耐久至少一项讲不通；或完全押单一不可持续因素
      2: 略高或主要靠暂时利好/景气；空间小或耐久差，两三年内易见顶；引擎说不清
      3: 系统性更高，但空间或耐久一般（接近天花板或只能赌一两年）；引擎在形成，跑道中等
      4: 空间、引擎、耐久三条大体成立，仍在兑现；持续成长/周期反转/新品至少一条逻辑说通
      5: 更高；空间大、引擎清晰可续、十年内可持续兑现；多证据同向。

  - id: management
    label: 管理层（1-5分）
    hint: 十年信托测试：诚信、懂生意、会花钱
    ttl_days: 180
    essence: >
      核心问题：十年里能否放心把公司和资本交给这帮人？
      三要素：诚信、懂生意、会花钱（像主人一样配置资本，增厚长期价值）。
      边界：商业模式、护城河、成长、企业文化、估值、风险各自单独评，不混入本维度。
    scoring_checks:
      - 信息源：优先立案/处罚、诉讼仲裁、交易所问询、调查或争议报道；营销稿与自述仅作参考
      - 打分须引用可核实公开记录；无独立负面亦不能单凭自述给 4～5 分
      - 诚信：占小股东便宜、隐瞒、承诺失信？危机时敢讲坏消息吗？
      - 面对巨大诱惑，管理者会坚守初心吗？还是乱多元化，金融手段牟利？
      - 是否进取和正直？
    rubric:
      1: 独立信源有实锤：立案/重罚、占款挪用、承诺严重落空、审计非标、重大诉讼败诉等
      2: 有问询/警示或争议调查无实锤；或有乱花钱记录（失败并购、盲目多元化、大股东质押风险）
      3: 无重大负面实锤，但独立信源少或信息平淡；偶有小瑕疵，不足以给高分
      4: 未见诚信硬伤；回购注销/聚焦主业/逆周期投入有案可查；危机披露较坦诚
      5: 多年监管与调查报道干净；资本配置持续增厚股东，穿越周期有可核正面记录

  - id: culture
    label: 企业文化（1-5分）
    hint: 评激励与制度下的默认选择：压力下护长期并担责，而不是护数字并甩锅；不评 CEO 个人
    ttl_days: 180
    essence: >
      核心本质：企业文化是激励与制度塑造的、压力下仍会复现的默认选择——
      在无人监督与危机里，组织会护长期价值并主动担责，而不是护短期数字并甩锅。
      用晋升/考核/危机案例与一线行为验证，不看墙上海报；CEO 个人诚信归「管理层」。
      边界：商业模式、护城河、成长、管理层个人、具体风险不混入本维度。
    scoring_checks:
      - 时间观：晋升与奖金主要依据 1 年内 KPI，还是 2 年及以上结果？
        必须四选一：短期为主 / 长期为主 / 混合 / 无法判断
      - 无人监督：近 3 年有无具体案例——无人盯时仍护质量/客户，或默许 shortcuts 刷 KPI？
        各列 0～1 个可核实事例；若无事例写「无公开案例」
      - 危机担责：近 5 年重大负面或危机中，组织主动披露担责 vs 推给外部/个体/甩锅？
        统计倾向（担责为主 / 甩锅为主 / 各半 / 无重大事件）并各举 0～1 例
      - 激励一致：实际 Top 晋升或高奖金行为，与宣称价值观一致 / 部分一致 / 相反？
      - 传承：换 CEO 或核心业务负责人后，上述默认行为仍持续？
        必须四选一：是 / 否 / 尚无换人 / 无法判断
    rubric:
      1: ≥2 项 checks 为短期为主、甩锅为主或相反；或有组织级诚信丑闻、激励明显鼓励刷数字
      2: 1 项 checks 为上述负面；或口号与行为常不一致，靠强管控才不出事
      3: checks 正负参半，或公开证据不足只能推断；守规矩但 KPI 仍主导日常决策
      4: ≥3 项 checks 为长期为主、担责为主、一致、传承为是；无重大甩锅先例
      5: 全部 5 项 checks 正面且各有可核实案例；危机主动担责有先例；换领导后行为仍延续

  - id: margin_of_safety
    label: 安全边际（1-5分）
    hint: 现价相对粗略内在价值有没有足够折扣；对照程序多档 PE/DCF 安全边际
    ttl_days: 30
    essence: >
      核心问题：现在买，相对「合理价值」有没有 enough 缓冲？
      程序已按多个经典档位（深度价值/基准白马/品质复利/顶级特许等）
      分别计算 PE 法与简易 DCF 的 MOS 与 intrinsic_price_*。
      你必须先选定最契合本股的一档，再据此打分；不可混用不同档位的数字。
      边界：只评价格 vs 粗略价值；商业模式/成长好坏不混入本维度。
    scoring_checks:
      - 你选了哪一档？为何不是其他档（一两句即可）？
      - 该档 MOS 是否 >30%（才可能 4～5 分）？<0 表示相对该档假设高估
      - 该档 PE 与 DCF 是否同向？亏损时 DCF/PE 可能不可用，需说明
      - 用 owner_earnings 来源（经营现金流 or 利润）判断 DCF 是否偏乐观
      - 如果三年后市场给15-25倍PE，我能赚多少？
    rubric:
      1: 明显高估（所选档 MOS 深度为负，现价远高于 intrinsic_price）
      2: 略高估或几乎无折扣（所选档 MOS <10%）
      3: mild 折扣约 10～25%，或 PE/DCF 信号不一致
      4: 明确折扣约 25～40%，所选档至少一种方法清晰支持
      5: 深度折扣 >40%，所选档 PE/DCF 大致同向且假设不太离谱

valuation:
  default_tier: baseline
  tiers:
    - id: deep_value
      label: 深度价值
      fair_pe: 10.0
      discount_rate: 0.12
      terminal_growth: 0.02
      typical_for: 周期股、低增长成熟股、强调硬折扣的安全边际
    - id: baseline
      label: 基准白马
      fair_pe: 15.0
      discount_rate: 0.10
      terminal_growth: 0.03
      typical_for: 一般优质企业、市场中枢假设
    - id: quality_compounder
      label: 品质复利
      fair_pe: 20.0
      discount_rate: 0.09
      terminal_growth: 0.04
      typical_for: 护城河强、ROE 高、可长期复利的消费/制造龙头
    - id: elite_franchise
      label: 顶级特许
      fair_pe: 25.0
      discount_rate: 0.08
      terminal_growth: 0.04
      typical_for: 稀缺品牌、极强定价权、机构十年视角的极少数标的

prompt:
  language: simple
  include_quant_summary: true
  require_rubric_alignment: true
