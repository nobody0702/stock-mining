dimensions:
  - id: business_model
    label: 怎么赚钱（一句话）
    hint: 用卖什么、卖给谁、怎么收费说清楚
    ttl_days: 90
  - id: moat
    label: 护城河有多深（1-5分+一句话）
    hint: 竞争对手难不难抄，未来会不会更宽
    ttl_days: 90
  - id: management
    label: 管理层靠不靠谱
    hint: 老板和团队是否值得长期信任
    ttl_days: 180
  - id: growth_story
    label: 未来还能不能长大
    hint: 市场空间和公司增长点
    ttl_days: 60
  - id: why_cheap
    label: 为什么现在便宜
    hint: 是情绪错杀还是基本面真的坏了
    ttl_days: 30
  - id: risk
    label: 最可能出什么问题
    hint: 最大的风险和不确定性
    ttl_days: 30

prompt:
  language: simple
  include_quant_summary: true
