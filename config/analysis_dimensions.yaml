dimensions:
  - id: business_model
    label: 商业模式（1-5分）
    hint: 评「赚钱机器」质量：能否理解、能否反复赚、能否持续赚
    ttl_days: 90
    essence: >
      核心问题：这门生意能否被理解，并稳定把价值变成现金？
      四要素：可理解（钱从哪来说得清）、可重复（客户会反复付）、
      单位经济健康（做一单真赚钱）、可预测（不靠补贴或运气才能活）。
      边界：护城河、管理层、成长、估值、具体风险各自单独评，不混入本维度。
    scoring_checks:
      - 三句话讲清：卖什么、谁付钱、为何持续付？
      - 收入是重复性的，还是一次性/靠补贴/靠运气？
      - 单位经济是否健康：毛利与经营现金流是否正常？
      - 去掉最大单笔订单或补贴后，生意能否大致运转？
    rubric:
      1: 说不清怎么赚钱，或模式频繁变化；长期单位经济为负，靠外部输血才能活
      2: 能描述产品但收费逻辑模糊；或收入极不稳定、几乎不赚钱
      3: 模式清楚且已盈利，但定价权弱或波动大，复购/续单能见度一般
      4: 模式清楚，重复收入可预见，单位经济与现金流匹配，多年验证
      5: 极清晰且高度可重复，定价权或资本回报强，低维护即可守住赚钱能力

  - id: moat
    label: 护城河（1-5分）
    hint: 评用户（客户/买家，有选择权、能决定用不用你的一方，下面统一称为用户）离不离得开、这股力在变宽还是变窄；
      晚期看涨价会不会走，早期看越用会不会越离不开
    ttl_days: 90
    essence: >
      核心问题：让用户离不开、且随时间变宽的结构性力量有多强？
      护城河在变宽还是变窄——竞争压力下每天变强或变弱，不是静态标签。
      晚期用定价权验证：涨价后用户会不会走；早期用机制验证：越用会不会越离不开。
      边界：商业模式、管理层、成长、估值、具体风险各自单独评，不混入本维度。
    scoring_checks:
      - 用户主要为价格/效率留下，还是为不可替代的价值留下？
      - 涨价或对手略优时，用户会不会立刻流失？
      - 早期：使用越深，迁移成本、习惯或网络效应是否在加强？
      - 这股力是在变宽（复购加深、份额稳固），还是在变窄？
    rubric:
      1: 用户主要为便宜留下；涨价即走；无可见变宽机制，优势在缩小
      2: 有一点差异化，但对手易模仿；定价权弱，机制未形成复利
      3: 有结构性差异，对手抄需时间和投入；机制在形成或部分验证，定价权尚不清晰
      4: 优势已验证，越用越离不开或对手进入代价高；仍在主动变宽
      5: 定价权清晰，涨价用户不走；对手大量投入也难撼动，力量持续变宽

  - id: growth_story
    label: 成长性（1-5分）
    hint: 10 年后 earning power 是否更高；若更高，剩余增长跑道有多长、多大；不评新闻热点
    ttl_days: 60
    essence: >
      核心问题：10 年后 earning power 是否系统性高于今天？
      若更高，还剩多大的、可持续兑现的增长跑道——能否在十年内持续兑现，
      而非两三年后顶到天花板？
      剔除暂时 tailwind；新闻喊没成长或喊爆成长都要警惕。
      边界：护城河、管理层、估值、具体风险各自单独评，不混入本维度。
    scoring_checks:
      - 10 年后 earning power 会更高，还是持平/萎缩？
      - 增长主要来自结构与份额，还是暂时宏观/叙事 tailwind？
      - 结合参考信息中的市值、营收：相对行业可达空间，跑道还有多长？
      - 这股上行是在变宽，还是接近天花板？
    rubric:
      1: 10 年后 earning power 不更高或结构性萎缩；或增长完全押单一不可持续因素
      2: 略高或主要靠暂时因素；跑道短，两三年内易见顶
      3: 系统性更高，但行业/份额接近天花板；机制在形成，跑道中等
      4: 系统性更高，跑道清晰且较长；仍在兑现，未明显顶格
      5: 系统性更高，大跑道且十年内可持续兑现；不依赖单一宏观赌注

  - id: management
    label: 管理层（1-5分）
    hint: 十年信托测试：诚信、懂生意、会花钱
    ttl_days: 180
    essence: >
      核心问题：十年里能否放心把公司和资本交给这帮人？
      三要素：诚信、懂生意、会花钱（像主人一样配置资本，增厚长期价值）。
      边界：商业模式、护城河、成长、企业文化、估值、风险各自单独评，不混入本维度。
    scoring_checks:
      - 诚信：占小股东便宜、隐瞒、承诺失信？危机时敢讲坏消息吗？
      - 懂生意、会花钱：真懂主业吗？并购/扩产/回购是在增值还是刷面子？
    rubric:
      1: 诚信或能力重大疑点；乱花钱或明显短视
      2: 基本可信但偏短期；资本配置一般，关键岗位不稳
      3: 可信、懂生意；有长期心但配置或执行一般
      4: 诚信、像主人；配置理性，危机愿做正确但短期吃亏的事
      5: 高度可信；懂生意且会花钱；历史证明能穿越周期

  - id: culture
    label: 企业文化（1-5分）
    hint: 评组织默认怎么做：无人盯着时像主人还是刷 KPI；不评 CEO 个人
    ttl_days: 180
    essence: >
      核心问题：把公司交给这个组织十年，日常会默认护长期价值，还是护短期数字？
      看一线行为与激励（晋升/考核奖励什么），不看墙上海报；CEO 诚信归「管理层」。
      边界：商业模式、护城河、成长、管理层个人、具体风险不混入本维度。
    scoring_checks:
      - 无人盯时，护质量/声誉，还是护 KPI/短期利润？
      - 激励与晋升奖励长期价值，还是规模/概念/关系？
      - 换一届核心领导，这套默认做法大概率还在吗？
    rubric:
      1: 短期导向或组织诚信污点；激励鼓励刷数字；换领导即可能变味
      2: 口号与行为常不一致；靠层层管控才不出事；骨干不稳
      3: 守规矩能运转，但 KPI 压力仍明显；传承性一般
      4: 默认主人翁；激励偏长期；骨干稳定，换领导多半延续
      5: ethos 深入组织、可 deserved trust；少丑闻，能自我强化并跨代传承

  - id: margin_of_safety
    label: 安全边际（1-5分）
    hint: 现价相对粗略内在价值有没有足够折扣；对照程序多档 PE/DCF 安全边际
    ttl_days: 30
    essence: >
      核心问题：现在买，相对「合理价值」有没有 enough 缓冲？
      程序已按多个经典档位（深度价值/基准白马/品质复利/顶级特许等）
      分别计算 PE 法与简易 DCF 的 MOS 与 intrinsic_price_*。
      你必须先选定最契合本股的一档，再据此打分；不可混用不同档位的数字。
      边界：只评价格 vs 粗略价值；商业模式/成长好坏不混入本维度。
    scoring_checks:
      - 你选了哪一档？为何不是其他档（一两句即可）？
      - 该档 MOS 是否 >30%（才可能 4～5 分）？<0 表示相对该档假设高估
      - 该档 PE 与 DCF 是否同向？亏损时 DCF/PE 可能不可用，需说明
      - 用 owner_earnings 来源（经营现金流 or 利润）判断 DCF 是否偏乐观
    rubric:
      1: 明显高估（所选档 MOS 深度为负，现价远高于 intrinsic_price）
      2: 略高估或几乎无折扣（所选档 MOS <10%）
      3: mild 折扣约 10～25%，或 PE/DCF 信号不一致
      4: 明确折扣约 25～40%，所选档至少一种方法清晰支持
      5: 深度折扣 >40%，所选档 PE/DCF 大致同向且假设不太离谱

valuation:
  default_tier: baseline
  tiers:
    - id: deep_value
      label: 深度价值
      fair_pe: 10.0
      discount_rate: 0.12
      terminal_growth: 0.02
      typical_for: 周期股、低增长成熟股、强调硬折扣的安全边际
    - id: baseline
      label: 基准白马
      fair_pe: 15.0
      discount_rate: 0.10
      terminal_growth: 0.03
      typical_for: 一般优质企业、市场中枢假设
    - id: quality_compounder
      label: 品质复利
      fair_pe: 20.0
      discount_rate: 0.09
      terminal_growth: 0.04
      typical_for: 护城河强、ROE 高、可长期复利的消费/制造龙头
    - id: elite_franchise
      label: 顶级特许
      fair_pe: 25.0
      discount_rate: 0.08
      terminal_growth: 0.04
      typical_for: 稀缺品牌、极强定价权、机构十年视角的极少数标的

prompt:
  language: simple
  include_quant_summary: true
  require_rubric_alignment: true
