dimensions:
  - id: business_model
    label: 怎么赚钱（1-5分）
    hint: 用卖什么、卖给谁、怎么收费说清楚；分数越高商业模式越清晰、越可持续
    ttl_days: 90
    rubric:
      1: 说不清卖什么或钱从哪来；生意靠一次性运气，模式不稳定
      2: 能说出产品，但客户是谁、怎么收费很模糊；赚钱方式偏单一或波动大
      3: 卖什么、卖给谁、怎么收费基本清楚；能持续赚钱，但依赖单一产品或单一渠道
      4: 模式清楚且有多条收入线或渠道；客户愿意反复买，收费方式健康
      5: 模式非常清楚、可复制、可持续；多条产品线/渠道互相支撑，长期赚钱逻辑很硬

  - id: moat
    label: 护城河有多深（1-5分）
    hint: 竞争对手难不难抄；若有竞争对手，公司是否有明显差异化优势；未来能否进一步加深和拓宽这种优势；分数越高护城河越深
    ttl_days: 90
    rubric:
      1: 几乎没有壁垒，谁都能做，价格战严重
      2: 有一点品牌或渠道优势，但对手容易模仿，优势在缩小
      3: 有一定差异化（品牌、成本、渠道、技术等之一），对手抄需要时间和投入
      4: 有多重优势叠加，对手抄了也较难追上；公司还在主动加深优势
      5: 优势很难抄且越来越宽；对手即使投入大量资源也难撼动地位

  - id: management
    label: 管理层靠不靠谱（1-5分）
    hint: 老板和团队是否值得长期信任，是否长期主义、踏实实干；技术公司则看老板是否在该领域有深理解和建树；管理者能否凝聚团队、有影响力，危急时能否牺牲短期利益
    ttl_days: 180
    rubric:
      1: 有诚信或能力重大疑点；明显短视、乱搞，或团队涣散
      2: 基本能经营，但偏短期；团队凝聚力一般，关键岗位频繁动荡
      3: 总体可信、能干事；有长期打算但执行一般；团队基本稳定
      4: 长期主义、踏实；战略清晰，团队稳定有战斗力；危机时愿意做正确但短期吃亏的事
      5: 高度可信；老板/核心团队在行业内公认有建树；文化强、凝聚力强，历史证明能穿越周期

  - id: growth_story
    label: 未来还能不能长大（1-5分）
    hint: 市场空间和公司增长点；分数越高成长空间越大
    ttl_days: 60
    rubric:
      1: 行业萎缩或公司明显见顶，看不到新增长点
      2: 行业一般，公司只能维持；增长点少且不确定
      3: 行业还有空间，公司有 1～2 个可验证的增长方向
      4: 行业在扩容，公司有清晰的多条增长线（新产品、新市场、新渠道等）
      5: 行业空间大且公司在加速抢份额；多条增长线已跑通，未来 3～5 年仍能明显长大

  - id: why_cheap
    label: 为什么现在便宜（1-5分）
    hint: 是情绪错杀还是基本面真的坏了；分数越高越像被错杀的便宜，越低越像基本面真的坏了
    ttl_days: 30
    rubric:
      1: 便宜主因是基本面恶化（业绩下滑、竞争力丧失、财务风险），不是情绪
      2: 基本面已走弱，股价下跌大多有理由；便宜里「坑」的成分偏多
      3: 基本面好坏参半；跌有一部分情绪，也有一部分真实担忧
      4: 基本面仍健康或仅短期波动；股价跌 mainly 因情绪、行业恐慌或估值回归
      5: 基本面明显好或改善中，股价被过度抛售；很像错杀，估值处于历史偏低区

  - id: risk
    label: 最可能出什么问题（1-5分）
    hint: 最大的风险和不确定性；分数越高表示风险越大
    ttl_days: 30
    rubric:
      1: 风险可控，没有明显大雷；不确定性低
      2: 有一些风险，但都在可预见、可管理范围内
      3: 有 1～2 个值得重视的风险（竞争、政策、管理层、财务等），需要持续跟踪
      4: 多个风险叠加，任一触发都可能明显伤业绩或股价
      5: 存在可能改变投资逻辑的「黑天鹅」或致命风险（造假、核心业务崩塌、重大政策打击等）

prompt:
  language: simple
  include_quant_summary: true
  require_rubric_alignment: true
